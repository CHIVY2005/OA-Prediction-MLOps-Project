name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Set up Python 3.9
      uses: actions/setup-python@v4
      with:
        python-version: "3.9"
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        
    - name: Lint with flake8
      run: |
        # exit-zero treats all errors as warnings so it does not fail the build
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
        
    - name: Run tests with pytest
      run: |
        # Chạy pytest nếu có thư mục tests
        if [ -d "tests" ] && [ "$(ls -A tests)" ]; then
          pytest || true
        else
          echo "No tests directory found."
        fi

    - name: CI Success Notification
      if: success()
      run: |
        curl -H "Content-Type: application/json" -d '{
          "embeds": [{
            "title": "✅ CI Pipeline - Passed",
            "color": 3066993,
            "fields": [
              {"name": "Người Push (Actor)", "value": "`${{ github.actor }}`", "inline": true},
              {"name": "Nhánh (Branch)", "value": "`${{ github.ref_name }}`", "inline": true}
            ]
          }]
        }' "${{ secrets.CI_CD_WEBHOOK }}"

    - name: CI Failure Notification
      if: failure()
      run: |
        curl -H "Content-Type: application/json" -d '{
          "embeds": [{
            "title": "❌ CI Pipeline - Failed",
            "color": 15158332,
            "fields": [
              {"name": "Người Push (Actor)", "value": "`${{ github.actor }}`", "inline": true},
              {"name": "Nhánh (Branch)", "value": "`${{ github.ref_name }}`", "inline": true}
            ]
          }]
        }' "${{ secrets.CI_CD_WEBHOOK }}"
