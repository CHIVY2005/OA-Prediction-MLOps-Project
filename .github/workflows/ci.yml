name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Set up Python 3.9
      uses: actions/setup-python@v4
      with:
        python-version: "3.9"
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest httpx
        pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        
    - name: Lint with flake8
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --exclude=.git,.venv,venv,__pycache__ --statistics
        
    - name: Run tests with pytest
      run: |
        python -m pytest -q

    - name: CI Success Notification
      if: success()
      run: |
        curl -H "Content-Type: application/json" -d '{
          "embeds": [{
            "title": "✅ CI Pipeline - Passed",
            "color": 3066993,
            "fields": [
              {"name": "Người Push (Actor)", "value": "`${{ github.actor }}`", "inline": true},
              {"name": "Nhánh (Branch)", "value": "`${{ github.ref_name }}`", "inline": true}
            ]
          }]
        }' "${{ secrets.CI_CD_WEBHOOK }}"

    - name: CI Failure Notification
      if: failure()
      run: |
        curl -H "Content-Type: application/json" -d '{
          "embeds": [{
            "title": "❌ CI Pipeline - Failed",
            "color": 15158332,
            "fields": [
              {"name": "Người Push (Actor)", "value": "`${{ github.actor }}`", "inline": true},
              {"name": "Nhánh (Branch)", "value": "`${{ github.ref_name }}`", "inline": true}
            ]
          }]
        }' "${{ secrets.CI_CD_WEBHOOK }}"
